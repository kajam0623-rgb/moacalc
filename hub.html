<style>
  :root{
    --bg:#e7e6e1;--surface:#ffffff;--surface-2:#f2f1ec;--ink:#171a1f;--muted:#6b7178;
    --line:#dcdad2;--line-2:#bcbaad;--accent:#2a44c6;--accent-weak:#eceffb;--accent-ink:#22307c;--deduct:#bb392e;
    --fun:#b06a10;--fun-ink:#8a5209;--on-accent:#ffffff;
    --mono:ui-monospace,"SF Mono","Menlo",Consolas,"Roboto Mono",monospace;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#0e1116;--surface:#161b23;--surface-2:#1d2430;--ink:#eff2f7;
    --muted:#8d97a5;--line:#242c38;--line-2:#39434f;--accent:#93a4ff;--accent-weak:#161d30;--accent-ink:#b6bfff;--deduct:#ef8b7d;
    --fun:#e6b25a;--fun-ink:#f0c987;--on-accent:#0f1218;}}
  :root[data-theme="light"]{--bg:#e7e6e1;--surface:#fff;--surface-2:#f2f1ec;--ink:#171a1f;--muted:#6b7178;--line:#dcdad2;--line-2:#bcbaad;--accent:#2a44c6;--accent-weak:#eceffb;--accent-ink:#22307c;--deduct:#bb392e;--fun:#b06a10;--fun-ink:#8a5209;--on-accent:#ffffff;}
  :root[data-theme="dark"]{--bg:#0e1116;--surface:#161b23;--surface-2:#1d2430;--ink:#eff2f7;--muted:#8d97a5;--line:#242c38;--line-2:#39434f;--accent:#93a4ff;--accent-weak:#161d30;--accent-ink:#b6bfff;--deduct:#ef8b7d;--fun:#e6b25a;--fun-ink:#f0c987;--on-accent:#0f1218;}
  *{margin:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(42,68,198,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(42,68,198,.045) 1px,transparent 1px);
    background-size:28px 28px;}
  @media (prefers-color-scheme:dark){body{background-image:linear-gradient(rgba(147,164,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(147,164,255,.05) 1px,transparent 1px);}}
  .wrap{max-width:1180px;margin:0 auto;padding:30px 22px 60px;}
  /* 도구 페이지: 본문 + 우측 레일 (데스크톱) */
  .shell{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;}
  @media (min-width:900px){.shell{grid-template-columns:minmax(0,1fr) 300px;align-items:start;}
    .rail{position:sticky;top:24px;}}
  .rail h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700;}
  .rail .rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 6px;margin-bottom:14px;}
  .rail a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);
    text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600;}
  .rail a:last-child{border-bottom:none;}
  .rail a span{color:var(--muted);font-size:11.5px;font-weight:500;}
  .rail a:hover{color:var(--accent-ink);}
  .rail .rart{width:100%;border-radius:10px;display:block;margin-bottom:12px;border:1px solid var(--line);}
  /* home masthead */
  .masthead{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px;}
  .brand{font-size:27px;font-weight:800;letter-spacing:-1.2px;}
  .mh-sub{font-size:13px;color:var(--muted);margin-top:3px;}
  .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-align:right;line-height:1.6;}
  /* 로고 + 히어로 임팩트 */
  .hero{padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:20px;}
  .logo-row{display:flex;align-items:center;gap:10px;}
  .lmark{flex:0 0 auto;color:var(--ink);}
  .logo-row .brand{font-size:21px;font-weight:800;letter-spacing:-1px;}
  .logo-row .meta{margin-left:auto;}
  .hero-h{font-size:34px;font-weight:900;letter-spacing:-1.7px;line-height:1.14;margin:20px 0 8px;text-wrap:balance;}
  .hero-h b{color:var(--accent-ink);}
  .hero-sub{color:var(--muted);font-size:14px;margin-bottom:2px;text-wrap:balance;}
  .sect{display:flex;align-items:baseline;gap:12px;margin:38px 0 0;}
  .sect h2{font-size:19px;font-weight:800;letter-spacing:-.6px;}
  .sect p{font-size:12.5px;color:var(--muted);}
  .sect::after{content:"";flex:1;height:1px;background:var(--line);}
  .ccard .body .idxrow{padding:9px 0;margin:0;border-radius:0;font-size:13.5px;}
  .ccard .body .idxrow:hover{background:transparent;}
  .ccard .body .ix-n{font-size:13.5px;}
  .ccard .body .ix-d{display:none;}
  @media (min-width:900px){.hero-h{font-size:44px;letter-spacing:-2.2px;}.hero-sub{font-size:15.5px;}}
  .hero-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;}
  .hero-wrap.noart{grid-template-columns:1fr;}
  .hero-art{width:100%;display:block;border:1.5px solid var(--ink);border-radius:12px;box-shadow:7px 7px 0 var(--line-2);}
  @media (max-width:600px){.hero-wrap{grid-template-columns:1fr;}.hero-art{max-height:210px;object-fit:cover;object-position:left center;}}
  @keyframes heroFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  .hero-wrap:not(.noart) .hero-art{animation:rise .55s cubic-bezier(.2,.7,.3,1) .18s both, heroFloat 7s ease-in-out 1.2s infinite;}
  @media (prefers-reduced-motion:reduce){.hero-wrap .hero-art{animation:none;}}
  .pop{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .pop a{border:1px solid var(--line);border-radius:100px;padding:7px 14px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--muted);background:var(--surface-2);transition:.16s;}
  .pop a:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-weak);}
  .pop a.f{color:var(--fun-ink);border-color:color-mix(in srgb,var(--fun) 45%,var(--line));}
  .pop a.f:hover{background:color-mix(in srgb,var(--fun) 12%,transparent);border-color:var(--fun);}
  .cat-art{width:60px;height:60px;border-radius:12px;border:1px solid var(--line-2);object-fit:cover;flex:0 0 auto;transition:transform .25s cubic-bezier(.2,.7,.3,1);}
  .grp:hover .cat-art{transform:scale(1.12) rotate(-3deg);}
  .grp.reveal{opacity:0;transform:translateY(14px);}
  .grp.reveal.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1);}
  @media (prefers-reduced-motion:reduce){.grp.reveal{opacity:1;transform:none;}}
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .hero>*, .hero-wrap>*{animation:rise .55s cubic-bezier(.2,.7,.3,1) both;}
  .hero>*:nth-child(2){animation-delay:.07s;} .hero>*:nth-child(3){animation-delay:.14s;} .hero>*:nth-child(4){animation-delay:.21s;}
  .hero-wrap>*:nth-child(2){animation-delay:.18s;}
  @media (prefers-reduced-motion:reduce){.hero>*,.hero-wrap>*{animation:none;}}
  .sfoot{border-top:2px solid var(--ink);margin-top:44px;padding-top:22px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;font-size:12.5px;}
  @media (max-width:600px){.sfoot{grid-template-columns:1fr;}}
  .sfoot h4{font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:9px;font-weight:700;}
  .sfoot a{display:block;color:var(--muted);text-decoration:none;margin:5px 0;}
  .sfoot a:hover{color:var(--accent);}
  .sfoot .fbrand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--ink);margin-bottom:8px;}
  .sfoot p{color:var(--muted);line-height:1.7;font-size:11.5px;}
  .search{width:100%;padding:12px 2px;border:0;border-bottom:1.5px solid var(--line-2);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;margin-bottom:12px;}
  .search:focus{outline:none;border-bottom:2px solid var(--accent);}
  .search::placeholder{color:var(--muted);}
  /* ── 대시보드 카드 시스템 (Behance 2026 레퍼런스) ── */
  .wash{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .wash::before{content:"";position:absolute;top:-42%;right:-18%;width:62%;height:130%;pointer-events:none;
    background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 20%,transparent),transparent 72%);opacity:.5;}
  .wash>*{position:relative;}
  /* KPI 스탯 스트립 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 6px;}
  @media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{padding:15px 16px 14px;}
  .kpi .kl{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);}
  .kpi .kl i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;}
  .kpi.f .kl i{background:var(--fun);}
  .kpi .kv{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-1.2px;margin-top:7px;line-height:1;}
  .kpi .kd{font-size:11.5px;color:var(--muted);margin-top:5px;text-wrap:balance;}
  .kpi .kd b{color:var(--accent-ink);font-weight:700;}
  .kpi.f .kd b{color:var(--fun-ink);}
  /* 태그 (SEO·탐색) */
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 2px;}
  .tags a,.tags span{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);
    border:1px solid var(--line);border-radius:100px;padding:5px 11px;text-decoration:none;}
  .tags a:hover{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-weak);}
  /* 예시·주의 블록 */
  .exbox{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;}
  .exbox h3{font-size:13px;letter-spacing:.02em;color:var(--accent-ink);margin-bottom:10px;font-weight:800;}
  .exbox .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dotted var(--line-2);font-size:13.5px;}
  .exbox .row:last-of-type{border-bottom:none;}
  .exbox .row b{font-family:var(--mono);font-weight:700;}
  .exbox .res{margin-top:10px;padding-top:10px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;font-weight:800;font-size:15px;}
  .exbox .res b{font-family:var(--mono);color:var(--accent-ink);}
  .warns{margin-top:14px;}
  .warns li{list-style:none;position:relative;padding:8px 0 8px 22px;font-size:13.5px;line-height:1.75;border-bottom:1px dotted var(--line-2);}
  .warns li:last-child{border-bottom:none;}
  .warns li::before{content:"!";position:absolute;left:0;top:8px;width:15px;height:15px;border-radius:50%;
    background:var(--deduct);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .warns li b{color:var(--ink);}
  /* 카테고리 = 큰 카드 그리드 (일러스트가 주인공) */
  .catgrid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px;}
  @media (min-width:640px){.catgrid{grid-template-columns:repeat(2,1fr);}}
  @media (min-width:1000px){.catgrid{grid-template-columns:repeat(3,1fr);}}
  .ccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    transition:transform .2s cubic-bezier(.2,.7,.3,1),border-color .2s;}
  .ccard:hover{transform:translateY(-3px);border-color:var(--accent);}
  .ccard .thumb{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2);border-bottom:1px solid var(--line);}
  .ccard .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.7,.3,1);}
  .ccard:hover .thumb img{transform:scale(1.06);}
  .ccard .thumb b{position:absolute;left:14px;bottom:12px;font-size:16.5px;font-weight:800;letter-spacing:-.4px;color:#eff2f7;
    text-shadow:0 2px 14px rgba(0,0,0,.85);}
  .ccard .thumb em{position:absolute;right:12px;top:12px;font-style:normal;font-family:var(--mono);font-size:10.5px;color:#eff2f7;
    background:rgba(10,14,20,.66);border:1px solid rgba(255,255,255,.16);border-radius:100px;padding:3px 9px;backdrop-filter:blur(4px);}
  .ccard .body{padding:6px 14px 8px;flex:1;}
  .ccard .more{display:block;padding:11px 14px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;
    color:var(--accent-ink);text-decoration:none;background:var(--surface-2);}
  .ccard .more:hover{background:var(--accent-weak);}
  .ccard.f .thumb b{color:#fff;} .ccard.f .more{color:var(--fun-ink);}
  .ccard.f:hover{border-color:var(--fun);}
  /* 벤또 그리드 — 타일 크기를 다르게. .ccard 기본값보다 뒤·높은 특이도여야 덮어쓴다 */
  .bento{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px;}
  @media (min-width:640px){.bento{grid-template-columns:repeat(6,1fr);}
    .bento>*{grid-column:span 3;}
    .bento>.b-wide,.bento>.b-full{grid-column:span 6;}
    .bento>.b-wide .thumb,.bento>.b-full .thumb{aspect-ratio:16/9;}}
  @media (min-width:1000px){.bento{grid-template-columns:repeat(12,1fr);gap:16px;}
    .bento>*{grid-column:span 4;}
    .bento>.b-wide{grid-column:span 6;}
    .bento>.b-full{grid-column:span 12;flex-direction:row;align-items:stretch;}
    .bento>.b-wide .thumb{aspect-ratio:2/1;}
    .bento>.b-full .thumb{aspect-ratio:auto;width:40%;min-height:250px;border-bottom:none;border-right:1px solid var(--line);}
    .bento>.b-full .body{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px;align-content:center;padding:14px 22px;}
    .bento>.b-full .more{border-top:none;border-left:1px solid var(--line);display:flex;align-items:center;padding:0 20px;white-space:nowrap;}}
  /* 전체 목록 (하단, 다단) */
  .grp{margin-top:14px;padding:16px 16px 6px;}
  .alllist{columns:1;column-gap:26px;margin-top:6px;}
  @media (min-width:700px){.alllist{columns:2;}}
  @media (min-width:1000px){.alllist{columns:3;}}
  .alllist section{break-inside:avoid;margin-bottom:20px;}
  .cat{display:flex;align-items:center;gap:11px;margin-bottom:6px;}
  .cat span{font-size:12.5px;font-weight:800;letter-spacing:-.2px;color:var(--ink);white-space:nowrap;text-transform:none;}
  .cat::after{content:attr(data-n);flex:0 0 auto;margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);
    border:1px solid var(--line-2);border-radius:100px;padding:3px 9px;background:var(--surface-2);}
  .idxrow{display:flex;align-items:center;gap:12px;padding:11px 10px;margin:0 -10px;border-radius:9px;text-decoration:none;color:var(--ink);
    border-bottom:1px solid var(--line);transition:background .15s;}
  .idxrow:last-child{border-bottom:none;}
  .idxrow:hover{background:var(--surface-2);}
  .idxrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .ix-n{font-weight:600;font-size:14.5px;flex:0 0 auto;}
  .ix-d{color:var(--muted);font-size:12px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ix-a{font-family:var(--mono);color:var(--accent);font-size:14px;opacity:0;transform:translateX(-4px);transition:.18s;}
  .idxrow:hover .ix-a{opacity:1;transform:none;} .idxrow:hover .ix-n{color:var(--accent-ink);}
  /* tool view */
  .back{display:inline-block;font-family:var(--mono);color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:16px;}
  .back:hover{color:var(--accent);}
  .toolhero{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:18px;margin-bottom:20px;}
  .toolhero img{width:100%;display:block;aspect-ratio:16/7;object-fit:cover;}
  .toolhero .cap{position:absolute;left:0;right:0;bottom:0;padding:64px 22px 20px;
    background:linear-gradient(transparent,rgba(8,11,16,.93) 60%);}
  .toolhero .cap h1{font-size:30px;font-weight:900;letter-spacing:-1px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.85);margin:0;}
  .toolhero .cap .tl{color:#cfd6e0;font-size:13.5px;border:0;padding:0;margin:5px 0 0;}
  @media (min-width:760px){.toolhero .cap h1{font-size:38px;}}
  .th{font-size:25px;font-weight:800;letter-spacing:-.7px;margin-bottom:3px;text-wrap:balance;}
  .tl{color:var(--muted);font-size:13.5px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;}
  .tool label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 3px;}
  .tool label:first-child{margin-top:0;}
  .field{position:relative;}
  .field .suf{position:absolute;right:2px;bottom:11px;color:var(--muted);font-size:15px;font-weight:600;}
  .tool input,.tool select,.tool textarea{width:100%;border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:600;text-align:right;font-family:var(--mono);}
  .tool input{border:0;border-bottom:1.5px solid var(--line-2);padding:10px 22px 10px 2px;}
  .tool input:focus{outline:none;border-bottom:2px solid var(--accent);}
  .tool input[type=date],.tool input[type=time]{text-align:left;font-family:inherit;font-weight:600;font-size:15px;padding-right:2px;}
  .tool input[type=checkbox]{width:auto;border:0;padding:0;margin:0 6px 0 0;vertical-align:middle;accent-color:var(--accent);}
  .tool select{border:1px solid var(--line);border-radius:3px;background:var(--surface-2);padding:11px 12px;text-align:left;font-family:inherit;font-weight:600;font-size:15px;appearance:none;}
  .tool textarea{border:1px solid var(--line);border-radius:3px;background:var(--surface-2);padding:12px;text-align:left;font-family:inherit;font-weight:500;font-size:15px;min-height:140px;resize:vertical;}
  .tool select:focus,.tool textarea:focus{outline:none;border-color:var(--accent);}
  .tool button{border-radius:4px !important;font-family:inherit !important;letter-spacing:.02em;color:var(--on-accent) !important;background:var(--accent) !important;cursor:pointer;}
  .tool button:hover{filter:brightness(1.06);}
  /* 콘솔 히어로 (컨셉) */
  .console{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:16px;background:var(--surface);padding:16px 16px 18px;margin:18px 0 6px;
    box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 6%,transparent),0 18px 40px -22px rgba(0,0,0,.55);}
  .console::before{content:"";position:absolute;top:-70%;right:-10%;width:46%;height:180%;pointer-events:none;
    background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);opacity:.55;}
  .console>*{position:relative;}
  .sbar{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:0 12px;margin-top:10px;}
  .sbar svg{flex:0 0 auto;opacity:.55;}
  .sbar .search{border:0;margin:0;padding:12px 0;font-family:var(--mono);font-size:15px;}
  .sbar .search:focus{border:0;outline:none;}
  .sbar kbd{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line-2);
    border-radius:6px;padding:3px 7px;background:var(--surface);}
  .sbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);}
  .console .prompt{font-family:var(--mono);font-size:13px;color:var(--accent-ink);margin-bottom:10px;}
  .console .prompt b{color:var(--fun-ink);}
  .console .cur{display:inline-block;width:8px;height:15px;background:var(--fun);vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){.console .cur{animation:none;}}
  .console .search{margin:0;border-bottom-color:var(--line-2);font-family:var(--mono);}
  /* 운세·재미 카테고리 강조 */
  .grp.fun .cat span{color:var(--fun-ink);}
  .grp.fun .cat::after{background:var(--fun);opacity:.5;}
  .grp.fun .idxrow:hover{background:color-mix(in srgb,var(--fun) 12%,transparent);}

    var c=progressive(base),cr=c<=13e5?c*.55:715000+(c-13e5)*.3,lim=g<=33e6?74e4:g<=7e7?66e4:g<=12e7?5e5:2e5;

  // sel = 감출 input의 선택자, 돌릴 때마다 그 날짜의 일진 간지를 보여준다.
  function birthDial(el,sel,onChange){
    if(typeof document==="undefined")return null;
    var inp=el.querySelector(sel);if(!inp)return null;
    var host=inp.parentNode;if(!host)return null; // 검증 하네스의 mock DOM 대비
    var base=(inp.value||"1990-03-15").split("-");
    var Y=+base[0]||1990,M=+base[1]||3,D=+base[2]||15;
    var nowY=new Date().getFullYear();
    var wrap=document.createElement("div");wrap.className="dial";
    var gan=document.createElement("div");gan.className="dial-ganji";
    function pad(n){return n<10?"0"+n:""+n;}
    function daysIn(y,m){return new Date(y,m,0).getDate();}
    function build(unit,from,to,cur,suffix){
      var c=document.createElement("div");c.className="dial-col";c.dataset.unit=unit;
      c.tabIndex=0;c.setAttribute("role","listbox");c.setAttribute("aria-label",suffix);
      c.appendChild(Object.assign(document.createElement("div"),{className:"dial-pad"}));
      for(var v=from;v<=to;v++){
        var i=document.createElement("div");i.className="dial-item"+(v===cur?" on":"");

        c.appendChild(i);}
      c.appendChild(Object.assign(document.createElement("div"),{className:"dial-pad"}));
      return c;}
    var cols={y:build("y",1930,nowY,Y,"년"),m:build("m",1,12,M,"월"),d:build("d",1,daysIn(Y,M),D,"일")};
    wrap.appendChild(cols.y);wrap.appendChild(cols.m);wrap.appendChild(cols.d);
    var selBar=document.createElement("div");selBar.className="dial-sel";wrap.appendChild(selBar);
    inp.style.display="none";
    host.insertBefore(wrap,inp.nextSibling);
    host.insertBefore(gan,wrap.nextSibling);
    function center(col){ // 스크롤 위치로 가운데 항목을 판정한다
      var items=col.querySelectorAll(".dial-item");
      var idx=Math.round(col.scrollTop/44);
      return items[Math.max(0,Math.min(items.length-1,idx))];}
    function mark(col){
      var it=center(col);if(!it)return;
      col.querySelectorAll(".dial-item").forEach(function(x){x.classList.toggle("on",x===it);});
      return +it.dataset.v;}
    function scrollTo(col,v,smooth){
      var items=col.querySelectorAll(".dial-item");
      for(var i=0;i<items.length;i++)if(+items[i].dataset.v===v){

    function rebuildDays(){ // 2월 30일 같은 값이 남지 않도록 일 목록을 다시 만든다

      var v=Y+"-"+pad(M)+"-"+pad(D);

        var p=sjPillars(Y,M,D,null,0,false);
        gan.innerHTML='이 날의 일진 <b>'+SJ_SH[p.d.s]+SJ_BH[p.d.b]+'</b> ('+SJ_S[p.d.s]+SJ_B[p.d.b]+') · '+SJ_TTI[p.y.b]+'띠';

    // rAF는 백그라운드 탭에서 실행되지 않아 휠이 0(1930년)에 머문 채 값과 어긋난다.

    ["XII","매달린 사람","🙃","관점의 전환과 기다림. 멈춘 것이 아니라 숙성되는 중입니다.","희생만 하는 정체. 의미 없는 버티기라면 내려올 용기도 필요합니다."],
    ["XIII","죽음","🦋","끝과 새 시작. 낡은 것을 보내야 새것이 들어옵니다.","변화에 대한 저항. 붙잡을수록 이별은 길어집니다."],
    ["XIV","절제","🕊️","조화와 중용. 서로 다른 것을 섞어 더 나은 것을 만드는 연금술.","과유불급. 어느 한쪽으로 쏠린 생활의 균형을 점검하세요."],
    ["XV","악마","⛓️","강한 유혹과 집착. 끊어야 할 것이 무엇인지 이미 알고 있습니다.","속박에서 벗어날 기회. 사슬은 생각보다 느슨합니다."],
    ["XVI","탑","🌩️","갑작스러운 붕괴와 충격. 무너진 자리가 진짜 기초를 보여줍니다.","위기의 예감 또는 아슬아슬한 회피. 근본 문제를 미루지 마세요."],
    ["XVII","별","⭐","희망과 치유. 어둠 뒤에 뜨는 별처럼 조용한 회복이 시작됩니다.","희망을 잃은 상태. 별은 사라진 게 아니라 구름에 가려졌을 뿐입니다."],
    ["XVIII","달","🌕","불안과 모호함. 확실해질 때까지 큰 결정은 미루는 것이 좋습니다.","안개가 걷히며 진실이 드러납니다. 오해가 풀리는 시기."],
    ["XIX","태양","☀️","성공과 기쁨, 명료함. 있는 그대로 빛나도 되는 시기입니다.","일시적 구름. 성과가 늦어질 뿐 방향은 틀리지 않았습니다."],
    ["XX","심판","🎺","부활과 소명. 과거를 정리하고 한 단계 올라설 부름이 옵니다.","과거에 매인 자책. 용서(특히 자신에 대한)가 열쇠입니다."],
    ["XXI","세계","🌍","완성과 성취. 하나의 사이클이 아름답게 닫힙니다.","마무리 직전의 지연. 마지막 조각 하나만 채우면 됩니다."]];
    // 분야별 해석 — [연애·관계, 일·금전] (카드 순서는 M과 동일)
    var FLD=[
    ["설레지만 아직 형태가 없는 감정입니다. 재고 따지면 놓치고, 무작정 뛰어들면 다칩니다.","새 일을 벌이기 좋은 때. 다만 계약서와 자금 계획 없이 시작하면 대가를 치릅니다."],
    ["마음을 움직일 수단이 이미 손에 있습니다. 먼저 연락하는 쪽이 흐름을 쥡니다.","실력을 보여줄 무대가 열립니다. 준비된 것을 꺼내 놓기만 하면 됩니다."],
    ["말하지 않은 마음이 오갑니다. 캐묻기보다 기다리는 편이 관계를 지킵니다.","드러나지 않은 정보가 열쇠입니다. 겉으로 보이는 조건만으로 판단하지 마세요."],
    ["애정이 무르익고 돌보는 마음이 커집니다. 결혼·동거 등 다음 단계 이야기가 나옵니다.","투자한 것이 열매를 맺습니다. 사람을 키우는 일에서 특히 성과가 납니다."],
    ["안정을 원하는 마음이 강합니다. 규칙을 정하면 편해지지만 강요하면 숨이 막힙니다.","체계와 직위가 힘이 됩니다. 원칙대로 처리한 일이 신뢰로 돌아옵니다."],
    ["주변의 조언이나 양가의 의견이 관계에 개입합니다. 전통적인 절차가 도움이 됩니다.","멘토·선배·기존 시스템의 도움을 받으세요. 혼자 새로 만들 필요가 없습니다."],
    ["선택의 순간입니다. 두 사람 사이든 두 사람 중이든, 미루면 상황이 대신 결정합니다.","협업과 계약의 카드. 함께할 상대를 고르는 판단이 성패를 가릅니다."],
    ["밀어붙이면 이깁니다. 다만 상대의 속도를 무시하면 이기고도 잃습니다.","추진력이 최고조입니다. 방향만 맞다면 지금이 속도를 낼 때입니다."],
    ["힘으로 누르지 말고 다정함으로 다가가세요. 인내가 관계를 바꿉니다.","조급함을 이기는 사람이 가져갑니다. 꾸준히 밀고 간 쪽이 결국 인정받습니다."],
    ["거리를 두고 마음을 정리할 시간이 필요합니다. 혼자만의 답을 먼저 찾으세요.","혼자 파고드는 작업에 유리합니다. 사람을 모으는 일은 잠시 미루세요."],
    ["예기치 못한 만남이나 재회가 있습니다. 흐름이 바뀌는 시점입니다.","운때가 도는 카드. 준비된 상태라면 우연처럼 기회가 붙습니다."],
    ["공평함이 관건입니다. 한쪽만 참고 있었다면 그 사실이 드러납니다.","계약·정산·법적 문제에서 정확한 쪽이 이깁니다. 문서를 남기세요."],
    ["기다림의 시기입니다. 지금 애써 끌어당기면 오히려 멀어집니다.","일이 멈춰 보이지만 숙성 중입니다. 관점을 바꾸면 새 길이 보입니다."],
    ["한 관계의 형태가 끝나고 다른 형태로 바뀝니다. 이별이 아니라 변화일 수 있습니다.","낡은 방식을 정리해야 합니다. 붙잡고 있는 것을 놓아야 다음이 들어옵니다."],
    ["서로 다른 속도를 맞춰가는 시기입니다. 극단적인 요구는 관계를 해칩니다.","분산과 균형이 답입니다. 한쪽에 몰아넣지 말고 나눠서 가세요."],
    ["끊어야 할 집착이나 소모적인 관계가 보입니다. 익숙함이 곧 사랑은 아닙니다.","단기 이익의 유혹이 큽니다. 조건이 지나치게 좋다면 대가가 숨어 있습니다."],
    ["갑작스러운 충돌이나 이별의 조짐. 감춰둔 문제가 한 번에 터집니다.","예상 밖의 변수로 계획이 무너집니다. 무너진 자리가 진짜 문제를 보여줍니다."],
    ["조용한 회복과 치유. 서두르지 않아도 마음이 다시 열립니다.","장기적으로 좋아지는 흐름. 지금 뿌린 것이 나중에 크게 돌아옵니다."],
    ["오해와 불안이 섞입니다. 확인하지 않은 추측이 관계를 흔듭니다.","정보가 불확실합니다. 큰 결정은 사실 확인이 끝난 뒤로 미루세요."],
    ["관계가 밝게 드러납니다. 숨길 것 없이 표현해도 되는 시기입니다.","성과가 눈에 보이는 형태로 나옵니다. 인정받고 알려지기 좋은 때입니다."],
    ["관계를 다시 정의할 때입니다. 지난 일을 정리하면 새 국면이 열립니다.","묵혀둔 일이 다시 살아납니다. 과거의 인연이나 프로젝트에서 기회가 옵니다."],
    ["하나의 여정이 완성됩니다. 결실을 맺거나, 잘 마무리하고 다음으로 갑니다.","목표 달성과 확장. 여기까지 온 것을 정리해 다음 무대로 옮길 때입니다."]];

    ["과거의 무모한 시작이 지금 상황의 뿌리입니다.","지금 계산 없이 뛰어들고 싶은 마음이 움직이고 있습니다.","곧 새로운 출발선에 서게 됩니다. 준비물은 용기 하나면 됩니다."],
    ["이미 가진 재능으로 시작한 일이 지금까지 이어지고 있습니다.","원하는 것을 만들 도구가 지금 손안에 모여 있습니다.","실력을 펼칠 무대가 곧 열립니다. 준비한 것을 꺼내면 됩니다."],
    ["말하지 못한 마음이나 감춰진 사정이 지금 상황의 배경입니다.","직감이 유난히 예리한 때입니다. 마음의 소리부터 들으세요.","시간이 지나면 감춰졌던 것이 드러나 답이 선명해집니다."],
    ["정성 들여 돌보고 가꿔온 것이 지금의 토대가 되었습니다.","애정과 창조력이 무르익어 결실을 향해 자라는 중입니다.","돌본 만큼 풍요로운 결실이 돌아오는 시기가 옵니다."],
    ["원칙과 책임으로 쌓아 올린 기반이 지금을 받치고 있습니다.","질서를 세우고 중심을 잡아야 할 자리에 서 있습니다.","기반이 단단해지고 주도권을 쥐는 위치로 올라섭니다."],
    ["어른이나 전통의 가르침이 지금 선택의 밑그림이 되었습니다.","검증된 길과 조언자의 말에 힘이 실리는 때입니다.","믿을 만한 조력자가 나타나 검증된 길을 안내합니다."],
    ["과거의 한 선택이 지금 관계와 상황의 방향을 정했습니다.","마음이 향하는 쪽과 조건 사이에서 선택이 진행 중입니다.","중요한 갈림길이 다가옵니다. 마음이 향하는 쪽에 답이 있습니다."],
    ["밀어붙여 얻어낸 승리의 경험이 지금의 추진력입니다.","고삐를 쥐고 달리는 중입니다. 방향만 맞다면 그대로 가세요.","속도가 붙어 목표에 빠르게 다가섭니다. 핸들만 놓치지 마세요."],
    ["힘이 아니라 인내로 버텨온 시간이 지금을 만들었습니다.","부드러운 용기로 상황을 길들이는 중입니다. 조급함만 조심하세요.","서두르지 않은 다정함이 결국 상대와 상황을 움직입니다."],
    ["혼자 고민하며 답을 찾던 시간이 지금 상황의 출발점입니다.","잠시 물러나 정리할 때입니다. 소음을 줄이면 답이 보입니다.","혼자만의 시간을 지나며 스스로 답을 찾게 됩니다."],
    ["예상 못 한 사건이 흐름을 바꿔 지금에 이르렀습니다.","운의 바퀴가 도는 중입니다. 흐름을 타는 쪽이 이깁니다.","전환점이 다가옵니다. 우연처럼 보이는 기회를 놓치지 마세요."],
    ["그때의 판단과 선택이 지금 결과로 정산되고 있습니다.","공정함이 관건인 때입니다. 기록과 근거를 남기세요.","뿌린 대로 거두는 결말이 옵니다. 정확한 쪽이 이깁니다."],
    ["멈춰 있던 시간이 사실은 관점을 바꾸는 숙성기였습니다.","지금은 기다림의 구간입니다. 억지로 당기면 멀어집니다.","기다림 끝에 관점이 뒤집히며 새 길이 보입니다."],
    ["한 시절의 끝이 지금 상황의 진짜 시작점이었습니다.","낡은 것을 보내는 중입니다. 붙잡을수록 이별이 길어집니다.","하나의 형태가 끝나고 완전히 새로운 국면이 열립니다."],
    ["극단을 피하고 섞어 온 균형 감각이 지금의 자산입니다.","서로 다른 것을 조율하는 중입니다. 중용이 답입니다.","균형을 되찾고 서로 다른 것이 어우러지는 때가 옵니다."],
    ["끊지 못한 집착이나 달콤한 유혹이 지금까지 이어졌습니다.","익숙함에 묶여 있는 때입니다. 사슬은 생각보다 느슨합니다.","유혹이 커지는 구간이 옵니다. 조건이 좋을수록 대가를 살피세요."],
    ["갑작스러운 충격이나 붕괴가 지금 상황의 원점입니다.","쌓아온 것이 흔들리는 중입니다. 근본부터 다시 보세요.","급격한 변화가 올 수 있습니다. 무너진 자리가 기초를 보여줍니다."],
    ["어두운 터널을 지나온 경험이 지금의 희망을 만들었습니다.","조용한 회복이 진행 중입니다. 서두르지 않아도 됩니다.","치유와 희망의 시기가 옵니다. 뿌린 것이 천천히 돌아옵니다."],
    ["모호했던 상황과 오해가 지금까지 그림자를 드리웠습니다.","안개 속을 걷는 중입니다. 추측 대신 확인이 필요합니다.","불확실한 구간을 지나면 안개가 걷히고 진실이 드러납니다."],

    var ART={0:"tarot-00-fool",1:"tarot-01-magician",2:"tarot-02-priestess",3:"tarot-03-empress",4:"tarot-04-emperor",5:"tarot-05-hierophant",6:"tarot-06-lovers",7:"tarot-07-chariot",8:"tarot-08-strength",9:"tarot-09-hermit",10:"tarot-10-wheel",11:"tarot-11-justice",12:"tarot-12-hanged",13:"tarot-13-death",14:"tarot-14-temperance",15:"tarot-15-devil",16:"tarot-16-tower",17:"tarot-17-star",18:"tarot-18-moon",19:"tarot-19-sun",20:"tarot-20-judgement",21:"tarot-21-world"};
    var FLDN=["연애·관계","일·금전","전체 흐름"];

    '<button id="re" style="margin-top:16px;width:100%;padding:13px;border:none;font:inherit;font-weight:800">다시 뽑기</button>';
    // 세 장을 엮는 종합 해석 — 역방향 수·여정 단계·결과 카드 방향으로 조합
    function summary(pk,fi){
      var revN=pk.filter(function(x){return x.rev;}).length;
      var avg=(pk[0].i+pk[1].i+pk[2].i)/3;
      var flow=revN===0?"세 장 모두 정방향입니다. 지금 흐름에 큰 저항이 없다는 뜻이라, 망설이는 시간이 가장 큰 손해입니다."
        :revN===1?"한 장이 역방향입니다. 전체 흐름은 살아 있고, 한 지점에서만 속도가 걸립니다. 그 자리를 먼저 손보세요."
        :revN===2?"두 장이 역방향입니다. 방향보다 방식에 문제가 있습니다. 목표는 그대로 두고 접근을 바꿀 때입니다."

        :"카드들이 여정의 후반에 있습니다. 정리하고 매듭짓는 힘이 강한 구간입니다.";
      var fut=pk[2].rev
        ? "미래 자리의 "+pk[2].c[1]+"가 역방향으로 나왔습니다. 결말이 나쁘다는 뜻이 아니라, 지금 방식 그대로 가면 결과가 늦거나 다른 모양으로 온다는 신호입니다."

      var end=fi==="0"?"관계에 관한 질문이라면, 오늘 뽑은 세 장은 상대의 마음보다 내가 어떤 자리에 서 있는지를 먼저 보여줍니다."

        :span<=6?"세 장의 번호가 가까이 모여 있습니다. 과거·현재·미래가 같은 주제로 이어져 있다는 뜻이라, 지금 붙잡고 있는 문제 하나가 세 자리를 모두 지배하고 있습니다."
        :"세 장의 번호가 적당한 간격으로 놓여 있습니다. 흐름이 한 방향으로 천천히 이동하는 중이라, 급하게 바꾸기보다 지금 속도를 유지하는 편이 낫습니다.";
      return '<div class="sj-sec"><h3>세 장을 함께 보면</h3><p>'+flow+' '+stage+'</p>'+

        '<p style="margin-top:10px">'+fut+' '+end+'</p>'+
        '<p style="margin-top:10px">이 스프레드는 메이저 아르카나 22장 중 세 장을 뽑아 과거·현재·미래 자리에 놓은 결과입니다. 같은 카드라도 어느 자리에 놓이느냐에 따라 뜻이 달라지므로, 카드 이름의 인상보다 자리와 방향을 함께 읽어야 합니다. 오늘 답이 흐릿하게 느껴진다면 카드가 아니라 질문이 넓어서일 가능성이 큽니다. 질문을 한 문장으로 좁혀 다시 뽑아보세요.</p></div>';}
    var picks;
    function deal(){
      var idx=[];while(idx.length<3){var n=Math.floor(Math.random()*22);if(idx.indexOf(n)<0)idx.push(n);}
      picks=idx.map(function(n){return {c:M[n],i:n,rev:Math.random()<0.4};});

          : '<div class="tr-f"><span class="no">'+pk.c[0]+'</span><span class="sym" style="display:inline-block'+(pk.rev?';transform:rotate(180deg)':'')+'">'+pk.c[2]+'</span><span class="nm">'+pk.c[1]+'</span>'+(pk.rev?'<span class="rv">역방향</span>':'')+'</div>';

      var opened=0;
      el.querySelectorAll(".tr-card").forEach(function(card){
        card.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();card.click();}});
        card.addEventListener("click",function(){
        if(card.classList.contains("flip"))return;card.classList.add("flip");

        var ext=(fi==="2")?"":" <b style=\"color:var(--fun-ink)\">"+FLDN[fi]+"</b> — 이 카드가 가리키는 자리는 “"+FLD[pk.i][+fi]+"”"+

        var posLine=POSM[pk.i][i]+(pk.rev?" 다만 역방향이라 이 흐름이 뒤집히거나 지연됩니다.":"");
        el.querySelector("#r").innerHTML+='<div class="one"><b>'+POS[i]+' — '+pk.c[1]+(pk.rev?" (역방향)":"")+'</b>'+
          '<p style="color:var(--muted);font-size:12.5px">'+STORY[pk.i]+'</p>'+
          '<p style="margin-top:8px"><b style="color:var(--fun-ink)">'+POS[i]+'의 자리</b> — '+posLine+'</p>'+
          '<p style="margin-top:8px">'+(pk.rev?pk.c[4]:pk.c[3])+ext+'</p>'+
          '<p style="margin-top:8px;color:var(--muted);font-size:12.5px">'+ARC[pk.i<8?0:pk.i<15?1:2]+' '+POS_GUIDE[i]+(pk.rev?" 역방향으로 나온 카드는 그 힘이 사라졌다는 뜻이 아니라, 안으로 향하거나 속도가 걸려 있다는 신호입니다.":" 정방향으로 나온 카드는 그 힘이 밖으로 자연스럽게 흐르고 있다는 뜻입니다.")+'</p></div>';

    el.querySelector("#re").addEventListener("click",deal);

    "식신":[85,"먹을 복과 표현력이 살아나는 날. 아이디어를 입 밖으로 꺼내면 일이 풀립니다.","실적·창작·요리·발표 모두 유리. 재물은 자연스럽게 따라옵니다.","즐기는 마음이 최고의 전략인 하루.","과식과 과음. 먹을 복이 좋은 날일수록 몸이 먼저 신호를 보냅니다.",[6,6,4,-4],
     "표현이 자연스러워지는 날입니다. 마음을 미루지 말고 말이나 문자로 꺼내세요. 함께 먹는 자리가 특히 좋은 날이라, 밥 한 끼 제안이 관계를 바꿉니다.","만드는 일, 쓰는 일, 발표하는 일 전부 순조롭습니다. 오늘 내놓은 결과물이 예상보다 좋은 반응을 얻습니다.","입이 즐거운 날이라 과식하기 쉽습니다. 소화기 부담만 조심하면 컨디션 자체는 좋습니다.","표현이 풀리는 날. 마음을 입 밖으로 꺼낼 것."],
    "상관":[68,"재기가 번뜩이지만 말이 앞서기 쉬운 날. 아이디어는 최고, 표현은 한 템포 늦게.","윗사람·규칙과의 마찰 주의. 창의적인 일엔 오히려 대길.","오늘 떠오른 발상은 메모해두면 나중에 돈이 됩니다.","윗사람 앞에서의 한마디. 옳은 말이라도 오늘은 절반만 하세요.",[-6,4,-10,2],
     "할 말을 참지 못하는 날입니다. 맞는 말이라도 오늘 하면 상처가 됩니다. 하고 싶은 말은 적어두었다가 내일 꺼내세요.","기존 방식의 허점이 유난히 잘 보입니다. 문제를 지적하는 대신 대안까지 함께 내놓으면 오늘의 날카로움이 실적이 됩니다.","신경이 예민해져 두통이나 목·어깨 결림이 오기 쉽습니다. 화면에서 눈을 떼는 시간이 필요합니다.","번뜩이는 날. 단, 말은 한 템포 늦게."],
    "편재":[80,"큰돈이 움직이는 날. 기회는 빠르게 오고 빠르게 지나갑니다.","투자·거래·협상에 유리하나 욕심의 크기만큼 리스크도 커집니다.","계산기를 먼저 두드리고 움직이면 승산이 있습니다.","한 방을 노리는 판단. 오늘의 큰 기회는 큰 손실과 같은 문으로 들어옵니다.",[6,10,2,-2],
     "매력이 넓게 퍼지는 날입니다. 새로운 만남의 기회가 많지만 깊이보다 넓이로 흐르기 쉬우니, 진지한 관계라면 한 사람에게 집중하세요.","거래·영업·협상에 힘이 실립니다. 숫자를 다루는 일에서 감이 잘 맞는 날이라, 미뤄둔 제안을 오늘 넣어보세요.","활동량이 많아 피로가 쌓이는 줄 모릅니다. 이동이 잦은 날이면 끼니를 거르지 마세요.","큰돈이 움직이는 날. 계산기부터 두드릴 것."],
    "정재":[83,"성실함이 그대로 돈이 되는 날. 꾸준히 하던 일에서 결실이 보입니다.","저축·계약·꼼꼼한 정산에 좋은 날. 한탕보다 확실한 것.","오늘 뿌린 신용은 이자가 붙어 돌아옵니다.","지나친 인색함. 아껴야 할 자리와 써야 할 자리를 구분하세요.",[4,10,4,2],
     "안정적인 애정운입니다. 화려한 이벤트보다 약속을 지키는 태도가 점수를 얻습니다. 오래 만난 사이라면 다음 단계를 이야기하기 좋은 날입니다.","꼼꼼함이 그대로 평가로 돌아옵니다. 정산·검토·마감 같은 일이 특히 잘 풀리고, 계약서에 도장을 찍기에도 무난한 날입니다.","규칙적인 생활이 몸에 잘 맞는 날입니다. 큰 이상은 없으나 같은 자세로 오래 앉아 있는 것만 주의하세요.","성실이 돈 되는 날. 한탕 말고 확실한 것."],
    "편관":[58,"압박과 도전이 함께 오는 날. 부담스럽지만 이겨내면 급이 올라갑니다.","무리한 일정·과로·언쟁 주의. 운동으로 기운을 빼면 좋습니다.","피하지 말고 정면으로. 단, 서류와 말은 두 번 확인.","과로와 언쟁. 오늘 몸을 몰아붙이면 이번 주 내내 대가를 치릅니다.",[-8,0,6,-12],
     "감정의 온도차가 커지는 날입니다. 상대의 말을 공격으로 받아들이기 쉬우니, 대답하기 전에 한 번 숨을 고르세요. 오늘의 다툼은 대개 피곤함에서 옵니다.","부담스러운 과제가 떨어지지만 이걸 넘기면 평가가 달라집니다. 혼자 떠안지 말고 일정과 범위를 먼저 못 박으세요.","가장 조심할 항목입니다. 과로·수면 부족·긴장성 통증이 겹치기 쉬우니 오늘만큼은 일찍 마무리하세요.","압박의 날. 정면 돌파하되 몸은 아낄 것."],
    "정관":[82,"질서와 인정의 날. 원칙대로 처리하면 윗사람의 신임을 얻습니다.","승진·시험·계약·공식 업무에 유리합니다.","오늘은 정도(正道)가 지름길입니다.","편법과 지각. 오늘만큼은 절차를 건너뛰지 마세요.",[4,2,10,0],
     "예의와 신뢰가 매력이 되는 날입니다. 가벼운 농담보다 약속 시간을 지키는 쪽이 훨씬 크게 작용합니다. 소개나 공식적인 자리에서 좋은 인연이 닿습니다.","오늘의 주 무대입니다. 시험·면접·보고·승인 요청 전부 유리하고, 원칙대로 처리한 일이 그대로 평판이 됩니다.","무난합니다. 다만 긴장을 오래 유지하는 날이라 저녁엔 의식적으로 힘을 빼주세요.","인정받는 날. 오늘은 원칙이 지름길."],
    "편인":[65,"생각이 깊어지는 날. 직감은 예리하나 실행이 늦어질 수 있습니다.","공부·연구·기획엔 좋고, 계약·확답은 하루 미루세요.","혼자만의 시간이 답을 가져다줍니다.","즉답과 확답. 오늘 내린 결론은 내일 다시 보면 달라 보입니다.",[-6,-2,0,4],
     "혼자 있고 싶은 마음이 커집니다. 상대는 이걸 거리 두기로 오해할 수 있으니, 말없이 사라지지 말고 한마디만 남기세요.","자료를 파고들거나 구조를 다시 짜는 일에 최적입니다. 반대로 즉답이 필요한 회의나 협상은 오늘 잡지 않는 게 좋습니다.","머리는 바쁜데 몸은 처지는 날입니다. 잠들기 전 생각이 꼬리를 물지 않게 화면을 일찍 끄세요.","생각이 깊어지는 날. 확답은 내일로."],
    "정인":[84,"귀인과 배움의 날. 어른·스승·문서에서 도움이 옵니다.","합격·승인·소식운이 좋습니다. 배우는 만큼 쌓입니다.","도움을 받으면 감사를 표현하세요. 운이 두 배가 됩니다.","혼자 끙끙 앓기. 오늘은 도움을 청하면 대부분 열립니다.",[2,0,6,6],
     "보살핌을 주고받는 날입니다. 상대의 힘든 이야기를 들어주는 것만으로 관계가 깊어집니다. 윗사람의 소개로 인연이 닿기도 합니다.","배움과 문서에 볕이 듭니다. 합격·승인·자격 같은 소식이 오기 쉽고, 막힌 일은 경험 많은 사람에게 물으면 바로 풀립니다.","회복이 잘 되는 날입니다. 미뤄둔 검진이나 치료를 시작하기에도 좋습니다.","귀인의 날. 단, 혼자 앓지 말 것."]};

      var myEl=SJ_ES[me.d.s],luckEl=st.yong,L=SJ_LUCK[luckEl],hb=sjYukhap(tB);

      else sinLine="내 명식에는 두드러진 신살이 없습니다. 특정한 기운에 휘둘리지 않는 담백한 구조라, 오늘 같은 날에는 외부 변수보다 내 선택이 결과를 더 크게 좌우합니다.";
      var yongLine=yongHit?("오늘 일진 천간이 바로 그 "+SJ_EL[st.yong]+" — 용신이 들어오는 날입니다. 평소보다 판단이 선명하고 몸이 가볍습니다. 미뤄둔 결정은 오늘 내리세요."):
        yongClash?("오늘 일진 천간의 "+SJ_EL[todayEl]+" 기운이 용신 "+SJ_EL[st.yong]+josa(SJ_EL[st.yong],"를/을")+" 극하는 날입니다. 판단이 평소보다 무겁게 느껴질 수 있으니 큰 결정은 하루 미루는 편이 낫습니다."):

      if(myB%4===mB%4&&myB!==mB)mNote=" 내 일지와 이달 월지가 삼합이라 사람의 도움이 이 달 내내 힘을 보탭니다.";
      else if(Math.abs(myB-mB)===6)mNote=" 내 일지와 이달 월지가 충이라 달 전체에 변동수가 깔려 있습니다. 일정에 여유분을 두세요.";

      // 내일 미리보기 — 재방문 훅
      var tmr=new Date(ty,tm-1,td+1),tp=sjPillars(tmr.getFullYear(),tmr.getMonth()+1,tmr.getDate(),null,0,false);

  {id:"stargunghap",cat:"재미·운세",icon:"",name:"별자리 궁합",desc:"12별자리 커플 궁합",render:function(el){

    '<div id="out"></div>';
    function go(){
      var A=el.querySelector("#a").value.replace(/\s/g,""),B=el.querySelector("#b").value.replace(/\s/g,"");
      if(!A||!B)return;
      var mix=[],L=Math.max(A.length,B.length);
      for(var i=0;i<L;i++){if(A[i])mix.push(strokes(A[i]));if(B[i])mix.push(strokes(B[i]));}
      var steps=[mix.map(function(x){return x%10;})],cur=steps[0];
      while(cur.length>2){var nx=[];for(var j=0;j<cur.length-1;j++)nx.push((cur[j]+cur[j+1])%10);steps.push(nx);cur=nx;}
      var score=cur.length===2?cur[0]*10+cur[1]:cur[0];if(score===0)score=100;
      var msg=score>=90?"운명이라 불러도 될 점수! 오늘 바로 연락하세요.":score>=75?"아주 잘 어울리는 짝. 함께 있으면 웃음이 끊이지 않습니다.":score>=55?"노력하면 무르익는 궁합. 반은 하늘이, 반은 두 사람이 만듭니다.":score>=35?"밀당이 필요한 사이. 다름이 매력이 될 수도 있어요.":"불꽃 튀는 상극?! 그래서 더 끌리는 법이죠.";
      var pyramid=steps.map(function(row,ri){return '<div style="text-align:center;font-family:var(--mono);font-size:'+(ri===steps.length-1?'22px;font-weight:800;color:var(--fun)':'14px;color:var(--muted)')+';letter-spacing:8px;margin:4px 0">'+row.join("")+'</div>';}).join("");
      // 점수대별 관계 해설 — [유형, 잘 맞는 점, 부딪히는 점, 조언]
      var BAND=score>=90
        ? ["운명형","서로의 리듬이 거의 같습니다. 말하지 않아도 다음 행동이 예측되는 편이라 함께 있는 시간이 편안합니다.","너무 닮아서 새로움이 줄어들 수 있습니다. 둘 다 같은 것을 피하면 아무도 그 문제를 해결하지 않습니다.","이 정도로 잘 맞으면 오히려 표현을 게을리하기 쉽습니다. 당연한 것을 말로 확인하는 습관이 이 관계를 지킵니다."]
        : score>=75
        ? ["안정형","기본 호흡이 잘 맞는 조합입니다. 큰 갈등 없이 오래 이어지는 형태예요.","무난함에 익숙해지면 서로의 변화를 눈치채지 못합니다.","가끔 새로운 것을 함께 해보세요. 이 조합은 자극이 부족할 때만 흔들립니다."]
        : score>=55
        ? ["성장형","처음엔 낯설지만 시간이 지날수록 서로에게 맞춰지는 조합입니다.","맞춰가는 과정에서 한쪽이 더 많이 양보하고 있다고 느끼기 쉽습니다.","서로 다른 점을 고치려 들지 말고 규칙으로 정하세요. 이 조합은 대화의 양이 결과를 만듭니다."]
        : score>=35
        ? ["밀당형","끌리는 힘과 밀어내는 힘이 함께 있습니다. 지루할 틈은 없는 조합이에요.","감정의 진폭이 커서 좋을 때와 나쁠 때의 온도차가 큽니다.","화가 난 상태에서 결론을 내지 마세요. 이 조합은 타이밍만 조절해도 점수가 달라집니다."]
        : ["도전형","서로 완전히 다른 결을 가진 조합입니다. 배울 것이 많은 대신 이해에 시간이 걸립니다.","기본 전제가 달라 같은 말을 다르게 알아듣기 쉽습니다.","이 놀이의 점수는 낮아도 실제 관계와는 별개입니다. 다른 만큼 서로에게 없는 것을 줄 수 있습니다."];
      var lenNote=(A.length!==B.length)
        ? "두 이름의 글자 수가 달라, 짧은 쪽이 먼저 끝나고 남은 글자가 이어 붙습니다. 그래서 순서를 바꾸면 점수가 달라질 수 있어요."
        : "두 이름의 글자 수가 같아 획수가 나란히 번갈아 놓입니다. 가장 정석적인 배열이에요.";
      el.querySelector("#out").innerHTML=
      '<div class="out" style="margin-top:16px"><div class="k">'+escH(A)+' ♥ '+escH(B)+'</div><div class="v">'+score+'<small>점 · '+BAND[0]+'</small></div></div>'+
      '<div class="sj-sec"><h3>획수 피라미드</h3>'+pyramid+
      '<p style="font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7">맨 윗줄이 두 이름의 획수를 번갈아 놓은 것이고, 이웃한 두 수를 더해 일의 자리만 남기며 줄여 내려갑니다. 마지막 두 자리가 점수예요. '+lenNote+'</p></div>'+
      '<div class="sj-sec"><h3>풀이</h3><p>'+msg+'</p></div>'+
      '<div class="sj-sec"><h3>이 조합의 좋은 점</h3><p>'+BAND[1]+'</p></div>'+
      '<div class="sj-sec"><h3>부딪히기 쉬운 점</h3><p>'+BAND[2]+'</p></div>'+
      '<div class="sj-sec"><h3>조언</h3><p>'+BAND[3]+'</p></div>'+
      '<p class="note">이름 글자의 획수를 번갈아 놓고 이웃끼리 더하는 전통 이름궁합 놀이입니다. 한글 자모의 획수를 기준으로 계산하므로 한자 이름과는 결과가 다를 수 있습니다. 재미로만 보세요. 사주 기반 궁합은 궁합 보기를 이용하세요.</p>';}
    el.querySelector("#go").addEventListener("click",go);go();}}
  ];

  // ---------- router / render ----------
  var CATS=["재미·운세","급여·노동","금융","부동산·세금","생활","변환·기타"];
  function home(){
    var LOGO='<svg class="lmark" viewBox="0 0 36 36" width="30" height="30" aria-hidden="true"><defs><mask id="dnbs"><rect width="36" height="36" fill="#fff"/><circle cx="24.5" cy="13" r="8.5" fill="#000"/></mask></defs><rect x="1.5" y="1.5" width="33" height="33" rx="9" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="19" cy="18.5" r="8.5" fill="var(--fun)" mask="url(#dnbs)"/><circle cx="25.5" cy="24.5" r="1.7" fill="var(--accent)"/></svg>';
    var h='<header class="hero"><div class="logo-row">'+LOGO+'<span class="brand">동네보살</span><span class="meta">2026 · '+TOOLS.length+' TOOLS</span></div>'+
      '<h1 class="hero-h">뭐든 물어보세요.<br><b>동네 보살이 답합니다.</b></h1>'+
      '<div class="hero-sub">무료 사주·오늘의 운세·별자리 운세부터 실수령액·퇴직금까지 '+TOOLS.length+'가지, 한 곳에서.</div>'+
      '<div class="hero-trust" style="font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:10px;max-width:520px;border-left:2px solid var(--fun);padding-left:10px">랜덤 문구가 아닙니다 — 태양황경을 직접 계산하는 만세력 엔진이 절기와 별자리를 판정합니다. 같은 생일, 같은 날이면 언제 눌러도 같은 결과.</div>'+
      '<div class="console"><div class="prompt">&gt; 무엇이 궁금하세요<span class="cur"></span></div>'+
      '<div class="sbar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
      '<input class="search" id="q" placeholder="사주, 오늘의 운세, 퇴직금…"><kbd>⌘K</kbd></div></div></header>';
    CATS.forEach(function(c){var items=TOOLS.filter(function(t){return t.cat===c;});
      h+='<section class="grp wash'+(c==="재미·운세"?" fun":"")+'" data-cat="'+c+'"><div class="cat" data-n="'+items.length+'"><span>'+c+'</span></div>'+items.map(function(t){
        return '<a class="idxrow" href="#'+t.id+'" data-name="'+t.name+'"><span class="ix-n">'+t.name+'</span><span class="ix-d">'+t.desc+'</span><span class="ix-a">→</span></a>';}).join("")+'</section>';});
    h+='<div class="ad">AD · 애드센스 / 쿠팡 배너 자리</div>'+
      '<div class="foot">© 2026 동네보살 · 모든 운세 풀이와 계산은 참고용입니다</div>';
    app.innerHTML=h;
    var q=document.getElementById("q");q.addEventListener("input",function(){var v=this.value.trim();
      app.querySelectorAll(".grp").forEach(function(g){var any=false;
        g.querySelectorAll(".idxrow").forEach(function(r){var m=r.dataset.name.indexOf(v)>=0;r.style.display=m?"":"none";if(m)any=true;});
        g.style.display=any?"":"none";});});
  }
  function view(t){
    app.innerHTML='<a class="back" href="#">← 전체 도구</a><h1 class="th">'+t.name+'</h1><div class="tl">'+t.desc+'</div>'+
      '<div class="card tool" id="tool"></div><div class="ad">AD · 애드센스 / 쿠팡 배너 자리</div>'+
      '<div class="foot">© 2026 동네보살 · 참고용</div>';
    t.render(document.getElementById("tool"));window.scrollTo(0,0);
  }
  function route(){var id=location.hash.slice(1),t=TOOLS.filter(function(x){return x.id===id;})[0];t?view(t):home();}
  window.addEventListener("hashchange",route);route();
})();
</script>
