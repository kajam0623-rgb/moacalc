<style>
  :root{
    --bg:#e7e6e1;--surface:#ffffff;--surface-2:#f2f1ec;--ink:#171a1f;--muted:#6b7178;
    --line:#dcdad2;--line-2:#bcbaad;--accent:#2a44c6;--accent-weak:#eceffb;--accent-ink:#22307c;--deduct:#bb392e;
    --fun:#b06a10;--fun-ink:#8a5209;--on-accent:#ffffff;
    /* 한글 폴백을 명시하지 않으면 monospace가 굴림 계열로 떨어져 자간이 벌어진다.
       영문·숫자만 모노로 두고 한글은 시스템 산세리프로 받는다. */
    --mono:ui-monospace,"SF Mono","Menlo",Consolas,"Roboto Mono","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{--bg:#0e1116;--surface:#161b23;--surface-2:#1d2430;--ink:#eff2f7;
    --muted:#8d97a5;--line:#242c38;--line-2:#39434f;--accent:#93a4ff;--accent-weak:#161d30;--accent-ink:#b6bfff;--deduct:#ef8b7d;
    --fun:#e6b25a;--fun-ink:#f0c987;--on-accent:#0f1218;}}
  :root[data-theme="light"]{--bg:#e7e6e1;--surface:#fff;--surface-2:#f2f1ec;--ink:#171a1f;--muted:#6b7178;--line:#dcdad2;--line-2:#bcbaad;--accent:#2a44c6;--accent-weak:#eceffb;--accent-ink:#22307c;--deduct:#bb392e;--fun:#b06a10;--fun-ink:#8a5209;--on-accent:#ffffff;}
  :root[data-theme="dark"]{--bg:#0e1116;--surface:#161b23;--surface-2:#1d2430;--ink:#eff2f7;--muted:#8d97a5;--line:#242c38;--line-2:#39434f;--accent:#93a4ff;--accent-weak:#161d30;--accent-ink:#b6bfff;--deduct:#ef8b7d;--fun:#e6b25a;--fun-ink:#f0c987;--on-accent:#0f1218;}
  *{margin:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;
    background-image:linear-gradient(rgba(42,68,198,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(42,68,198,.045) 1px,transparent 1px);
    background-size:28px 28px;}
  @media (prefers-color-scheme:dark){body{background-image:linear-gradient(rgba(147,164,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(147,164,255,.05) 1px,transparent 1px);}}
  .wrap{max-width:1180px;margin:0 auto;padding:30px 22px 60px;}
  /* 도구 페이지: 본문 + 우측 레일 (데스크톱) */
  .shell{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;}
  @media (min-width:900px){.shell{grid-template-columns:minmax(0,1fr) 300px;align-items:start;}
    .rail{position:sticky;top:24px;}}
  .rail h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700;}
  .rail .rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 6px;margin-bottom:14px;}
  .rail a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;min-height:44px;border-bottom:1px solid var(--line);
    text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600;}
  .rail a:last-child{border-bottom:none;}
  .rail a span{color:var(--muted);font-size:11.5px;font-weight:500;}
  .rail a:hover{color:var(--accent-ink);}
  /* height:auto가 없으면 HTML의 height="800" 속성이 살아남아 가로 이미지가 세로로 늘어난다 */
  .rail .rart{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:10px;display:block;margin-bottom:12px;border:1px solid var(--line);}
  /* home masthead */
  .masthead{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px;}
  .brand{font-size:27px;font-weight:800;letter-spacing:-1.2px;}
  .mh-sub{font-size:13px;color:var(--muted);margin-top:3px;}
  .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-align:right;line-height:1.6;}
  /* 로고 + 히어로 임팩트 */
  .hero{padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:20px;}
  .logo-row{display:flex;align-items:center;gap:10px;}
  .lmark{flex:0 0 auto;width:34px;height:auto;aspect-ratio:1/1;border-radius:50%;object-fit:cover;}
  .logo-row .brand{font-size:21px;font-weight:800;letter-spacing:-1px;}
  .logo-row .meta{margin-left:auto;}
  .hero-h{font-size:34px;font-weight:900;letter-spacing:-1.7px;line-height:1.14;margin:20px 0 8px;text-wrap:balance;}
  .hero-h b{color:var(--accent-ink);}
  .hero-sub{color:var(--muted);font-size:14px;margin-bottom:2px;text-wrap:balance;}
  .sect{display:flex;align-items:baseline;gap:12px;margin:38px 0 0;}
  .sect h2{font-size:19px;font-weight:800;letter-spacing:-.6px;}
  .sect p{font-size:12.5px;color:var(--muted);}
  .sect::after{content:"";flex:1;height:1px;background:var(--line);}
  .ccard .body .idxrow{padding:9px 0;margin:0;border-radius:0;font-size:13.5px;}
  .ccard .body .idxrow:hover{background:transparent;}
  .ccard .body .ix-n{font-size:13.5px;}
  .ccard .body .ix-d{display:none;}
  @media (min-width:900px){.hero-h{font-size:44px;letter-spacing:-2.2px;}.hero-sub{font-size:15.5px;}}
  .hero-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center;}
  .hero-wrap.noart{grid-template-columns:1fr;}
  .hero-art{width:100%;height:auto;display:block;border:1.5px solid var(--ink);border-radius:12px;box-shadow:7px 7px 0 var(--line-2);}
  @media (max-width:600px){.hero-wrap{grid-template-columns:1fr;}.hero-art{max-height:210px;object-fit:cover;object-position:left center;}}
  @keyframes heroFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
  .hero-wrap:not(.noart) .hero-art{animation:rise .55s cubic-bezier(.2,.7,.3,1) .18s both, heroFloat 7s ease-in-out 1.2s infinite;}
  @media (prefers-reduced-motion:reduce){.hero-wrap .hero-art{animation:none;}}
  .pop{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .pop a{display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:100px;padding:0 14px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--muted);background:var(--surface-2);transition:.16s;}
  .pop a:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-weak);}
  .pop a.f{color:var(--fun-ink);border-color:color-mix(in srgb,var(--fun) 45%,var(--line));}
  .pop a.f:hover{background:color-mix(in srgb,var(--fun) 12%,transparent);border-color:var(--fun);}
  .cat-art{width:60px;height:60px;border-radius:12px;border:1px solid var(--line-2);object-fit:cover;flex:0 0 auto;transition:transform .25s cubic-bezier(.2,.7,.3,1);}
  .grp:hover .cat-art{transform:scale(1.12) rotate(-3deg);}
  .grp.reveal{opacity:0;transform:translateY(14px);}
  .grp.reveal.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1);}
  @media (prefers-reduced-motion:reduce){.grp.reveal{opacity:1;transform:none;}}
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .hero>*, .hero-wrap>*{animation:rise .55s cubic-bezier(.2,.7,.3,1) both;}
  .hero>*:nth-child(2){animation-delay:.07s;} .hero>*:nth-child(3){animation-delay:.14s;} .hero>*:nth-child(4){animation-delay:.21s;}
  .hero-wrap>*:nth-child(2){animation-delay:.18s;}
  @media (prefers-reduced-motion:reduce){.hero>*,.hero-wrap>*{animation:none;}}
  .sfoot{border-top:2px solid var(--ink);margin-top:44px;padding-top:22px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;font-size:12.5px;}
  @media (max-width:600px){.sfoot{grid-template-columns:1fr;}}
  .sfoot h4{font-size:10.5px;letter-spacing:.14em;color:var(--muted);margin-bottom:9px;font-weight:700;}
  .sfoot a{display:flex;align-items:center;min-height:44px;color:var(--muted);text-decoration:none;margin:0;}
  .sfoot a:hover{color:var(--accent);}
  .sfoot .fbrand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--ink);margin-bottom:8px;}
  .sfoot p{color:var(--muted);line-height:1.7;font-size:11.5px;}
  .search{width:100%;padding:12px 2px;border:0;border-bottom:1.5px solid var(--line-2);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;margin-bottom:12px;}
  .search:focus{outline:none;border-bottom:2px solid var(--accent);}
  .search::placeholder{color:var(--muted);}
  /* ── 대시보드 카드 시스템 (Behance 2026 레퍼런스) ── */
  .wash{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .wash::before{content:"";position:absolute;top:-42%;right:-18%;width:62%;height:130%;pointer-events:none;
    background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 20%,transparent),transparent 72%);opacity:.5;}
  .wash>*{position:relative;}
  /* KPI 스탯 스트립 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 6px;}
  @media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{padding:15px 16px 14px;}
  .kpi .kl{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);}
  .kpi .kl i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;}
  .kpi.f .kl i{background:var(--fun);}
  .kpi .kv{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:-1.2px;margin-top:7px;line-height:1;}
  .kpi .kd{font-size:11.5px;color:var(--muted);margin-top:5px;text-wrap:balance;}
  .kpi .kd b{color:var(--accent-ink);font-weight:700;}
  .kpi.f .kd b{color:var(--fun-ink);}
  /* 태그 (SEO·탐색) */
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 2px;}
  .tags a,.tags span{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);
    border:1px solid var(--line);border-radius:100px;padding:5px 11px;text-decoration:none;}
  .tags a:hover{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-weak);}
  /* 예시·주의 블록 */
  .exbox{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;}
  .exbox h3{font-size:13px;letter-spacing:.02em;color:var(--accent-ink);margin-bottom:10px;font-weight:800;}
  .exbox .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dotted var(--line-2);font-size:13.5px;}
  .exbox .row:last-of-type{border-bottom:none;}
  .exbox .row b{font-family:var(--mono);font-weight:700;}
  .exbox .res{margin-top:10px;padding-top:10px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;font-weight:800;font-size:15px;}
  .exbox .res b{font-family:var(--mono);color:var(--accent-ink);}
  .warns{margin-top:14px;}
  .warns li{list-style:none;position:relative;padding:8px 0 8px 22px;font-size:13.5px;line-height:1.75;border-bottom:1px dotted var(--line-2);}
  .warns li:last-child{border-bottom:none;}
  .warns li::before{content:"!";position:absolute;left:0;top:8px;width:15px;height:15px;border-radius:50%;
    background:var(--deduct);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .warns li b{color:var(--ink);}
  /* 카테고리 = 큰 카드 그리드 (일러스트가 주인공) */
  .catgrid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px;}
  @media (min-width:640px){.catgrid{grid-template-columns:repeat(2,1fr);}}
  @media (min-width:1000px){.catgrid{grid-template-columns:repeat(3,1fr);}}
  .ccard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    transition:transform .2s cubic-bezier(.2,.7,.3,1),border-color .2s;}
  .ccard:hover{transform:translateY(-3px);border-color:var(--accent);}
  .ccard .thumb{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:var(--surface-2);border-bottom:1px solid var(--line);}
  .ccard .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s cubic-bezier(.2,.7,.3,1);}
  .ccard:hover .thumb img{transform:scale(1.06);}
  .ccard .thumb b{position:absolute;left:14px;bottom:12px;font-size:16.5px;font-weight:800;letter-spacing:-.4px;color:#eff2f7;
    text-shadow:0 2px 14px rgba(0,0,0,.85);}
  .ccard .thumb em{position:absolute;right:12px;top:12px;font-style:normal;font-family:var(--mono);font-size:10.5px;color:#eff2f7;
    background:rgba(10,14,20,.66);border:1px solid rgba(255,255,255,.16);border-radius:100px;padding:3px 9px;backdrop-filter:blur(4px);}
  .ccard .body{padding:6px 14px 8px;flex:1;}
  .ccard .more{display:flex;align-items:center;min-height:44px;padding:0 14px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;
    color:var(--accent-ink);text-decoration:none;background:var(--surface-2);}
  .ccard .more:hover{background:var(--accent-weak);}
  .ccard.f .thumb b{color:#fff;} .ccard.f .more{color:var(--fun-ink);}
  .ccard.f:hover{border-color:var(--fun);}
  /* 벤또 그리드 — 타일 크기를 다르게. .ccard 기본값보다 뒤·높은 특이도여야 덮어쓴다 */
  .bento{display:grid;grid-template-columns:1fr;gap:14px;margin-top:16px;}
  @media (min-width:640px){.bento{grid-template-columns:repeat(6,1fr);}
    .bento>*{grid-column:span 3;}
    .bento>.b-wide,.bento>.b-full{grid-column:span 6;}
    .bento>.b-wide .thumb,.bento>.b-full .thumb{aspect-ratio:16/9;}}
  @media (min-width:1000px){.bento{grid-template-columns:repeat(12,1fr);gap:16px;}
    .bento>*{grid-column:span 4;}
    .bento>.b-wide{grid-column:span 6;}
    .bento>.b-full{grid-column:span 12;flex-direction:row;align-items:stretch;}
    .bento>.b-wide .thumb{aspect-ratio:2/1;}
    .bento>.b-full .thumb{aspect-ratio:auto;width:40%;min-height:250px;border-bottom:none;border-right:1px solid var(--line);}
    .bento>.b-full .body{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px;align-content:center;padding:14px 22px;}
    .bento>.b-full .more{border-top:none;border-left:1px solid var(--line);display:flex;align-items:center;padding:0 20px;white-space:nowrap;}}
  /* 전체 목록 (하단, 다단) */
  .grp{margin-top:14px;padding:16px 16px 6px;}
  .alllist{columns:1;column-gap:26px;margin-top:6px;}
  @media (min-width:700px){.alllist{columns:2;}}
  @media (min-width:1000px){.alllist{columns:3;}}
  .alllist section{break-inside:avoid;margin-bottom:20px;}
  .cat{display:flex;align-items:center;gap:11px;margin-bottom:6px;}
  .cat span{font-size:12.5px;font-weight:800;letter-spacing:-.2px;color:var(--ink);white-space:nowrap;text-transform:none;}
  .cat::after{content:attr(data-n);flex:0 0 auto;margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);
    border:1px solid var(--line-2);border-radius:100px;padding:3px 9px;background:var(--surface-2);}
  .idxrow{display:flex;align-items:center;min-height:44px;gap:12px;padding:11px 10px;margin:0 -10px;border-radius:9px;text-decoration:none;color:var(--ink);
    border-bottom:1px solid var(--line);transition:background .15s;}
  .idxrow:last-child{border-bottom:none;}
  .idxrow:hover{background:var(--surface-2);}
  .idxrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .ix-n{font-weight:600;font-size:14.5px;flex:0 0 auto;}
  .ix-d{color:var(--muted);font-size:12px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ix-a{font-family:var(--mono);color:var(--accent);font-size:14px;opacity:0;transform:translateX(-4px);transition:.18s;}
  .idxrow:hover .ix-a{opacity:1;transform:none;} .idxrow:hover .ix-n{color:var(--accent-ink);}
  /* tool view */
  /* 모바일 터치 타겟 44px 확보 — 시각 크기는 그대로 두고 여백으로 누를 면적만 넓힌다 */
  /* 한글에 monospace를 쓰면 글자폭이 고정돼 자간이 벌어져 보인다. 한글 UI 텍스트는 본문 폰트로 둔다 */
  .back{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:6px;}
  .back:hover{color:var(--accent);}
  .toolhero{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:18px;margin-bottom:20px;}
  .toolhero img{width:100%;display:block;aspect-ratio:16/7;object-fit:cover;}
  .toolhero .cap{position:absolute;left:0;right:0;bottom:0;padding:64px 22px 20px;
    background:linear-gradient(transparent,rgba(8,11,16,.93) 60%);}
  .toolhero .cap h1{font-size:30px;font-weight:900;letter-spacing:-1px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.85);margin:0;}
  .toolhero .cap .tl{color:#cfd6e0;font-size:13.5px;border:0;padding:0;margin:5px 0 0;}
  @media (min-width:760px){.toolhero .cap h1{font-size:38px;}}
  .th{font-size:25px;font-weight:800;letter-spacing:-.7px;margin-bottom:3px;text-wrap:balance;}
  .tl{color:var(--muted);font-size:13.5px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;}
  .tool label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 3px;}
  .tool label:first-child{margin-top:0;}
  .field{position:relative;}
  .field .suf{position:absolute;right:2px;bottom:11px;color:var(--muted);font-size:15px;font-weight:600;}
  .tool input,.tool select,.tool textarea{width:100%;border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:600;text-align:right;font-family:var(--mono);}
  .tool input{border:0;border-bottom:1.5px solid var(--line-2);padding:10px 22px 10px 2px;}
  .tool input:focus{outline:none;border-bottom:2px solid var(--accent);}
  .tool input[type=date],.tool input[type=time]{text-align:left;font-family:inherit;font-weight:600;font-size:15px;padding-right:2px;}
  .tool input[type=checkbox]{width:auto;border:0;padding:0;margin:0 6px 0 0;vertical-align:middle;accent-color:var(--accent);}
  .tool select{border:1px solid var(--line);border-radius:3px;background:var(--surface-2);padding:11px 12px;text-align:left;font-family:inherit;font-weight:600;font-size:15px;appearance:none;}
  .tool textarea{border:1px solid var(--line);border-radius:3px;background:var(--surface-2);padding:12px;text-align:left;font-family:inherit;font-weight:500;font-size:15px;min-height:140px;resize:vertical;}
  .tool select:focus,.tool textarea:focus{outline:none;border-color:var(--accent);}
  .tool button{border-radius:4px !important;font-family:inherit !important;letter-spacing:.02em;color:var(--on-accent) !important;background:var(--accent) !important;cursor:pointer;}
  .tool button:hover{filter:brightness(1.06);}
  /* 콘솔 히어로 (컨셉) */
  .console{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:16px;background:var(--surface);padding:16px 16px 18px;margin:18px 0 6px;
    box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 6%,transparent),0 18px 40px -22px rgba(0,0,0,.55);}
  .console::before{content:"";position:absolute;top:-70%;right:-10%;width:46%;height:180%;pointer-events:none;
    background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);opacity:.55;}
  .console>*{position:relative;}
  .sbar{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:0 12px;margin-top:10px;}
  .sbar svg{flex:0 0 auto;opacity:.55;}
  .sbar .search{border:0;margin:0;padding:12px 0;font-size:15px;}
  .sbar .search:focus{border:0;outline:none;}

      function legacy(){ // clipboard API가 거부돼도 동작하는 최후 폴백

        '<p style="margin-top:10px">이 스프레드는 메이저 아르카나 22장 중 세 장을 뽑아 과거·현재·미래 자리에 놓은 결과입니다. 같은 카드라도 어느 자리에 놓이느냐에 따라 뜻이 달라지므로, 카드 이름의 인상보다 자리와 방향을 함께 읽어야 합니다. 오늘 답이 흐릿하게 느껴진다면 카드가 아니라 질문이 넓어서일 가능성이 큽니다. 질문을 한 문장으로 좁혀 다시 뽑아보세요.</p></div>';}
    var picks;
    function deal(){
      var idx=[];while(idx.length<3){var n=Math.floor(Math.random()*22);if(idx.indexOf(n)<0)idx.push(n);}
      picks=idx.map(function(n){return {c:M[n],i:n,rev:Math.random()<0.4};});
      el.querySelector("#r").innerHTML="";
      el.querySelector("#b").innerHTML=POS.map(function(p,i){
        var pk=picks[i],art=ART[pk.i];
        var face=art
          ? '<div class="tr-f art"><img src="img/char/'+art+'.webp" alt="'+pk.c[1]+' 타로 카드" class="'+(pk.rev?"rev":"")+'" loading="lazy" onerror="this.parentNode.classList.remove(\'art\');this.remove()"><span class="cap"><span class="nm">'+pk.c[1]+'</span>'+(pk.rev?'<span class="rv">역방향</span>':'')+'</span></div>'
          : '<div class="tr-f"><span class="no">'+pk.c[0]+'</span><span class="sym" style="display:inline-block'+(pk.rev?';transform:rotate(180deg)':'')+'">'+pk.c[2]+'</span><span class="nm">'+pk.c[1]+'</span>'+(pk.rev?'<span class="rv">역방향</span>':'')+'</div>';
        return '<div class="tr-slot"><div class="tr-pos">'+p+'</div><div class="tr-card" data-i="'+i+'" tabindex="0" role="button" aria-label="'+p+' 카드 뒤집기"><div class="tr-b">✦</div>'+face+'</div></div>';}).join("");
      var opened=0;
      el.querySelectorAll(".tr-card").forEach(function(card){
        card.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();card.click();}});
        card.addEventListener("click",function(){
        if(card.classList.contains("flip"))return;card.classList.add("flip");
        var i=+card.dataset.i,pk=picks[i],fi=el.querySelector("#f").value;
        // FLD는 카드의 정방향 주제다. 역방향이면 그 흐름이 지연·반전된다고 덧붙여야 해석이 어긋나지 않는다
        var ext=(fi==="2")?"":" <b style=\"color:var(--fun-ink)\">"+FLDN[fi]+"</b> — 이 카드가 가리키는 자리는 “"+FLD[pk.i][+fi]+"”"+
          (pk.rev?" 다만 역방향이라 이 흐름이 지연되거나 반대 방향으로 나타납니다.":"");
        var posLine=POSM[pk.i][i]+(pk.rev?" 다만 역방향이라 이 흐름이 뒤집히거나 지연됩니다.":"");
        el.querySelector("#r").innerHTML+='<div class="one"><b>'+POS[i]+' — '+pk.c[1]+(pk.rev?" (역방향)":"")+'</b>'+
          '<p style="color:var(--muted);font-size:12.5px">'+STORY[pk.i]+'</p>'+
          '<p style="margin-top:8px"><b style="color:var(--fun-ink)">'+POS[i]+'의 자리</b> — '+posLine+'</p>'+
          '<p style="margin-top:8px">'+(pk.rev?pk.c[4]:pk.c[3])+ext+'</p>'+
          '<p style="margin-top:8px;color:var(--muted);font-size:12.5px">'+ARC[pk.i<8?0:pk.i<15?1:2]+' '+POS_GUIDE[i]+(pk.rev?" 역방향으로 나온 카드는 그 힘이 사라졌다는 뜻이 아니라, 안으로 향하거나 속도가 걸려 있다는 신호입니다.":" 정방향으로 나온 카드는 그 힘이 밖으로 자연스럽게 흐르고 있다는 뜻입니다.")+'</p></div>';
        if(++opened===3)el.querySelector("#r").innerHTML+=summary(picks,fi);});});}
    el.querySelector("#re").addEventListener("click",deal);
    el.querySelector("#f").addEventListener("change",deal);deal();}},

  {id:"todayfortune",cat:"재미·운세",icon:"",name:"오늘의 운세",desc:"일진×일간 명리 풀이",render:function(el){
    // 오늘 일진 천간이 내 일간에 대해 갖는 십성
    // → [기본점수, 총운, 재물·일, 조언, 오늘의 주의, [애정·재물·직장·건강 보정], 애정운, 직장·학업운, 건강운]
    var TXT={
    "비견":[78,"나와 같은 기운이 들어오는 날일세. 남 눈치 볼 것 없이 내 걸음으로 밀고 가면 힘이 배로 붙어.","동료운은 트였네. 다만 돈은 섞지 말게. 같이 벌어도 계산은 각자 해야 뒤탈이 없어.","오늘은 경쟁자가 아군이 되는 날일세. 자존심 싸움만 피하면 돼.","친구·동료와 돈이 섞이는 자리. 빌려주는 것도, 대신 계산하는 것도 오늘은 만들지 말게.",[2,-4,4,6],
     "대등한 자리가 편한 날이야. 연인 사이라면 누가 이기려 드는 순간부터 어긋나네. 혼자인 사람은 새 인연보다 오래 알던 사람 쪽을 보게. 문이 거기 열려 있어.","같은 데를 보는 사람과 손잡으면 진도가 두 배로 나가. 다만 역할이랑 몫을 말로만 정하고 넘어가면 나중에 반드시 다시 이야기하게 되네. 오늘 적어두게.","기력이 좋은 날일세. 미뤄둔 운동은 오늘 시작하게. 좀 무리해도 회복이 빨라.","내 걸음으로 가는 날. 밀고 가되 돈은 각자."],
    "겁재":[62,"기운은 넘치는데 그게 안으로 안 고이고 밖으로 새는 날일세. 지갑도 마음도 오늘은 잠가두게.","충동구매, 보증, 즉흥 약속. 셋 다 오늘은 미루는 게 상책이야.","베풀되 한도를 정하게. 오늘의 선심이 내일 자네 부담으로 돌아와.","보증·대여·큰 결제. 오늘 지른 건 내일 아침이면 후회로 바뀌어 있네.",[-2,-12,2,4],
     "오늘 자네, 또 퍼주려 하지. 마음은 알겠는데 이번엔 반만 하게. 상대 부탁 다 받아주고 나면 서운해지는 건 결국 자네야. 약속은 지킬 수 있는 것만 하게.","옆자리가 경쟁자로 보이는 날일세. 자네 머리에서 나온 생각을 남이 먼저 말해버릴 수 있어. 억울해할 것 없이 미리 남겨두면 되네. 날짜 찍히는 곳에 적어두게.","낮엔 멀쩡하다 저녁에 뚝 떨어져. 기운이 밖으로만 쏠린 탓일세. 커피로 버티지 말고 야식으로도 버티지 말고, 일찍 눕게.","새는 날. 지갑도 마음도 잠가둘 것."],
    "식신":[85,"먹을 복과 말 복이 함께 드는 날일세. 속에 담아둔 걸 입 밖으로 꺼내면 일이 풀려.","실적이든 창작이든 요리든 발표든 다 유리해. 재물은 뒤따라오니 억지로 좇지 말게.","오늘은 즐기는 마음이 제일 좋은 전략일세.","과식과 과음. 먹을 복 좋은 날일수록 몸이 먼저 신호를 보내네.",[6,6,4,-4],
     "표현이 술술 풀리는 날이야. 마음 미루지 말고 말이든 글이든 꺼내게. 특히 같이 밥 먹는 자리가 좋아. 밥 한 끼 하자는 말 한마디가 관계를 바꿔놓네.","만드는 일, 쓰는 일, 내보이는 일 전부 순조로워. 오늘 내놓은 결과물이 자네 예상보다 좋은 소리를 들을 걸세.","입이 즐거우니 과식하기 쉬운 날이지. 속만 조심하면 컨디션 자체는 좋아.","표현이 풀리는 날. 담아둔 말은 꺼낼 것."],
    "상관":[68,"재기가 번뜩이는 날인데 말이 생각보다 먼저 나가는 날이기도 하네. 머리는 최고, 입은 한 박자 늦추게.","윗사람이나 규칙과 부딪히기 쉬워. 대신 새로 만드는 일에는 오히려 크게 길하네.","오늘 떠오른 발상은 적어두게. 그게 나중에 돈이 돼.","윗사람 앞에서의 한마디. 옳은 말이라도 오늘은 절반만 하게.",[-6,4,-10,2],
     "할 말을 못 참는 날일세. 맞는 말이라도 오늘 하면 상처로 남아. 하고 싶은 말은 적어뒀다가 내일 꺼내게.","남들 방식의 빈틈이 유난히 잘 보일 걸세. 지적만 하면 미움을 사고, 대안까지 같이 내놓으면 그 날카로움이 실적이 되네. 어느 쪽을 고를지는 자네 몫이야.","신경이 곤두서서 머리 아프거나 목·어깨가 뻣뻣해지기 쉬워. 화면에서 눈 떼는 시간을 좀 만들게.","번뜩이는 날. 단, 입은 한 박자 늦게."],
    "편재":[80,"큰돈이 움직이는 날일세. 기회가 빨리 오고 빨리 지나가니 붙잡을 거면 지금 붙잡게.","투자든 거래든 협상이든 힘이 실려. 다만 욕심 키운 만큼 위험도 같이 커지네.","계산기부터 두드리고 움직이게. 그러면 승산이 있어.","한 방을 노리는 판단. 오늘 들어오는 큰 기회는 큰 손실과 같은 문으로 들어오네.",[6,10,2,-2],
     "매력이 넓게 퍼지는 날이야. 만날 기회는 많은데 깊이보다 넓이로 흐르기 쉽지. 진지하게 갈 사이가 있거든 오늘은 한 사람만 보게.","거래·영업·협상에 힘이 실리는 날일세. 숫자 다루는 감이 잘 맞으니 미뤄둔 제안이 있거든 오늘 넣어보게.","움직임이 많아 피로가 쌓이는 줄도 모르는 날이야. 이동이 잦거든 끼니만은 거르지 말게.","큰돈이 움직이는 날. 계산기부터 두드릴 것."],
    "정재":[83,"성실함이 그대로 돈이 되는 날일세. 꾸준히 해오던 자리에서 결실이 보여.","저축·계약·정산에 좋은 날이야. 한탕보다 확실한 쪽을 잡게.","오늘 쌓은 신용은 이자가 붙어서 돌아오네.","지나친 인색함. 아낄 자리와 써야 할 자리는 구분할 줄 알아야 해.",[4,10,4,2],
     "요란한 이벤트보다 약속 지키는 태도가 점수를 얻는 날일세. 오래 만난 사이라면 다음 이야기를 꺼내기 좋은 날이야. 새 인연을 찾기보다 있는 사람을 챙기게.","꼼꼼함이 그대로 평가로 돌아오네. 정산·검토·마감 같은 일이 특히 잘 풀리고, 계약서에 도장 찍기에도 무난한 날일세.","규칙적으로 사는 게 몸에 잘 맞는 날이야. 큰 탈은 없으나 같은 자세로 오래 앉아 있는 것만 조심하게.","성실이 돈 되는 날. 한탕 말고 확실한 것."],
    "편관":[58,"압박과 도전이 같이 들어오는 날일세. 부담스럽지만 이걸 넘기면 자네 급이 한 칸 올라가네.","무리한 일정과 과로, 언쟁을 조심하게. 남는 기운은 운동으로 빼는 게 좋아.","피하지 말고 정면으로 가게. 단, 서류와 말은 두 번 확인하고.","과로와 언쟁. 오늘 몸을 몰아붙이면 이번 주 내내 그 값을 치르네.",[-8,0,6,-12],
     "감정의 온도차가 큰 날일세. 상대 말이 공격처럼 들리기 쉬우니 대답하기 전에 한 번 숨을 고르게. 오늘의 다툼은 대개 미움이 아니라 피곤함에서 나와.","부담스러운 게 떨어질 걸세. 그래도 이걸 넘기면 자네 보는 눈이 달라지네. 혼자 다 떠안지 말고 일정과 범위부터 못 박게.","오늘 제일 조심할 자리가 여기야. 과로에 잠 부족에 결린 데까지 겹치기 쉬우니, 오늘만큼은 일찍 접게.","압박의 날. 정면으로 가되 몸은 아낄 것."],
    "정관":[82,"질서와 인정의 날일세. 원칙대로 처리하면 윗사람 신임이 따라붙어.","승진이든 시험이든 계약이든 공식적인 일에 전부 유리하네.","오늘은 정도(正道)가 지름길일세.","편법과 지각. 오늘만큼은 절차를 건너뛰지 말게.",[4,2,10,0],
     "예의와 신뢰가 곧 매력이 되는 날이야. 가벼운 농담보다 약속 시간 지키는 쪽이 훨씬 크게 남네. 소개 자리나 공식적인 자리에서 인연이 닿아.","오늘의 주 무대일세. 시험·면접·보고·승인 요청 전부 유리하고, 원칙대로 처리한 일이 그대로 자네 평판이 되네.","무난해. 다만 긴장을 오래 붙들고 있는 날이라 저녁엔 일부러 힘을 좀 빼게.","인정받는 날. 오늘은 원칙이 지름길."],
    "편인":[65,"생각이 깊어지는 날일세. 직감은 날카로운데 손발이 굼떠지네.","공부·연구·기획엔 좋아. 계약이나 확답은 하루 미루게.","혼자 있는 시간이 답을 가져다주는 날일세.","즉답과 확답. 오늘 내린 결론은 내일 다시 보면 달라 보이네.",[-6,-2,0,4],
     "혼자 있고 싶어지는 날이야. 상대는 그걸 거리 두기로 오해하네. 말없이 사라지지 말고 한마디만 남기고 들어가게.","자료를 파고들거나 구조를 다시 짜는 데는 오늘만 한 날이 없어. 반대로 즉답이 필요한 회의나 협상은 오늘 잡지 말게.","머리는 바쁜데 몸은 처지는 날일세. 눕고 나서 생각이 꼬리를 물지 않게 화면을 일찍 끄게.","생각이 깊어지는 날. 확답은 내일로."],
    "정인":[84,"귀인과 배움의 날일세. 어른이든 스승이든 문서든, 위에서 내려오는 도움이 있네.","합격·승인·소식운이 좋아. 배운 만큼 그대로 쌓이는 날이야.","도움을 받거든 고맙다고 말로 하게. 그러면 운이 두 배가 되네.","혼자 끙끙 앓기. 오늘은 손 내밀면 대부분 열리네.",[2,0,6,6],
     "보살핌을 주고받는 날이야. 상대 힘든 이야기를 들어주는 것만으로 사이가 깊어지네. 윗사람 소개로 인연이 닿기도 해.","배움과 문서에 볕이 드는 날일세. 합격·승인·자격 같은 소식이 오기 쉽고, 막힌 일은 경험 많은 사람한테 물으면 바로 풀려.","회복이 잘 되는 날이야. 미뤄둔 검진이나 치료를 시작하기에도 좋네.","귀인의 날. 혼자 앓지 말 것."]};

    function go(){

      savePrefs({birth:el.querySelector("#d").value});track("fortune_view",{tool:"todayfortune"});
      var me=sjPillars(+dv[0],+dv[1],+dv[2],null,0,false);

    var q=document.getElementById("q");q.addEventListener("input",function(){var v=this.value.trim();
      app.querySelectorAll(".grp").forEach(function(g){var any=false;
        g.querySelectorAll(".idxrow").forEach(function(r){var m=r.dataset.name.indexOf(v)>=0;r.style.display=m?"":"none";if(m)any=true;});
        g.style.display=any?"":"none";});});
  }
  function view(t){
    app.innerHTML='<a class="back" href="#">← 전체 도구</a><h1 class="th">'+t.name+'</h1><div class="tl">'+t.desc+'</div>'+
      '<div class="card tool" id="tool"></div>'+
      '<div class="foot">© 2026 동네보살 · 참고용</div>';
    t.render(document.getElementById("tool"));window.scrollTo(0,0);
  }
  function route(){var id=location.hash.slice(1),t=TOOLS.filter(function(x){return x.id===id;})[0];t?view(t):home();}
  window.addEventListener("hashchange",route);route();
})();
</script>
